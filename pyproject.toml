[project]
name = "ling"
version = "0.0.0"
description = "Task, permission, and state kernel for multi-AI collaboration."
requires-python = ">=3.11"
readme = "README.md"
dependencies = ["transitions>=0.9.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ling = "ling.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
